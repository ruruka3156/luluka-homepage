
name: Update SF6 MR

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: python -m pip install requests

      - name: Fetch MR from Buckler
        env:
          BUCKLER_ID: ${{ secrets.BUCKLER_ID }}
        run: python scripts/update_mr.py

      - name: Commit updated MR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mr.json
          git diff --cached --quiet && exit 0
          git commit -m "Update SF6 MR"
          git push
